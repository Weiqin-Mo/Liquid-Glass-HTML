<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Card</title>
<style>
  :root { --blur: 16px; --bright: 1.1; }
  * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: white; font: 16px system-ui; background: radial-gradient(circle at 20% 20%, #8171ff, transparent 35%), radial-gradient(circle at 80% 70%, #ff73a8, transparent 35%), #11152b; }
  .card { width: min(420px, calc(100vw - 40px)); padding: 32px; border-radius: 28px; background: rgb(255 255 255 / 8%); backdrop-filter: blur(var(--blur)) saturate(180%) brightness(var(--bright)) var(--lg-filter, none); box-shadow: inset 0 1px rgb(255 255 255 / 35%), 0 24px 60px rgb(0 0 0 / 28%); }
  button { margin-top: 20px; padding: 10px 16px; border: 0; border-radius: 999px; color: white; background: #4facfe; cursor: pointer; }
</style>
<body data-liquid-glass-targets=".card">
  <main class="card"><small>核心效果</small><h1>Liquid Glass</h1><p>最小可运行示例：只保留玻璃卡片和共享渲染引擎。</p><button type="button">按住查看折射</button></main>
  <script src="../js/liquid-glass-engine.js"></script>
  <script>
    const card = document.querySelector('.card');
    LiquidGlass.refresh();
    document.querySelector('button').addEventListener('pointerdown', () => LiquidGlass.apply(card, true));
    document.querySelector('button').addEventListener('pointerup', () => LiquidGlass.apply(card, false));
  </script>
</body>
</html>
